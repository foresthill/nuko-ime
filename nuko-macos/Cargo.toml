[package]
name = "nuko-macos"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "ぬこIME macOS Input Method - InputMethodKit統合"

[[bin]]
name = "NukoIME"
path = "src/main.rs"

[features]
default = []
# libakaza ベースのかな漢字変換バックエンドを有効化 (nuko-core 側の同名 feature を有効化)
# 詳細は docs/spikes/libakaza-api-survey.md / libakaza-send-constraint.md
akaza = ["nuko-core/akaza"]

[dependencies]
nuko-core = { workspace = true }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSObject", "NSDictionary", "NSAttributedString", "NSRange", "NSGeometry", "NSValue"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSEvent", "NSRunningApplication", "NSResponder", "NSWindow", "NSPanel", "NSView", "NSTextField", "NSText", "NSControl", "NSColor", "NSScreen", "NSGraphics", "NSGraphicsContext", "NSFont", "NSAttributedString", "NSCell"] }
objc2-input-method-kit = { version = "0.3" }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
parking_lot = { workspace = true }
